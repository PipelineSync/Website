# Static site: no build step. HTML files and assets are served as-is.
[build]
  publish = "."

# HTML should always be revalidated so content and redirects update immediately.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are referenced by filename; cache them aggressively.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
